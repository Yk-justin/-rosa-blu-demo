<style>

 <div id="roomlist">${roomsList()}</div></div></section>`},after(){if(window._focusRoom){const r=db.rooms.find(x=>x.id===window._focusRoom);r&&roomFree(r.id,S.q.in,S.q.out)&&A.reserve(r.id)}}};
function payChoices(kind){const s=db.settings;const own=kind==='room'?s.payAtHotel:s.payOnCollection;
 return`<fieldset style="border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px"><legend class="small muted">Payment</legend>
 ${own?`<label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0"><input type="radio" name="pm" value="${kind==='room'?'Pay at hotel':'Pay on collection'}" checked style="width:auto">${kind==='room'?'Pay at the hotel':'Pay on collection / delivery'}</label>`:''}
 <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0"><input type="radio" name="pm" value="M-Pesa" ${own?'':'checked'} style="width:auto">M-Pesa <span class="pill warn">DEMO</span></label>
 <label style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0"><input type="radio" name="pm" value="Card" style="width:auto">Card <span class="pill warn">DEMO</span></label>
 <p class="small muted">Demo payments are simulated and marked DEMO. Real M-Pesa and card payments need provider credentials and server verification.</p></fieldset>`}
function payRecord(m){const demo=m==='M-Pesa'||m==='Card';return demo?{status:'PAID (DEMO)',method:m,ref:'DEMO-'+uid().toUpperCase(),demo:true}:{status:'UNPAID',method:m,ref:'',demo:false}}
function rememberCustomer(name,phone,email){let c=db.customers.find(x=>x.phone===phone||(email&&x.email===email));if(!c)db.customers.push({name,phone,email,created:Date.now()});else Object.assign(c,{name,email:email||c.email})}
/* ===== Menu ===== */
S.mq={cat:'All',s:''};
function menuList(){const q=S.mq;const L=db.menu.filter(m=>(q.cat==='All'||m.cat===q.cat)&&(!q.s||(m.name+m.desc).toLowerCase().includes(q.s.toLowerCase())));
 return L.length?`<div class="grid">${L.map(foodCard).join('')}</div>`:'<div class="empty">No dishes match your search. Try another category or clear the search box.</div>'}
PAGES.menu={html(){return`<section class="band"><div class="wrap stack"><span class="eyebrow">Food menu</span><h2>Our menu</h2><div class="row"><span class="pill ${isOpen()?'ok':'warn'}">${isOpen()?'Kitchen open':'Kitchen closed now'}</span><span class="small muted">Prices in Kenyan shillings (sample prices)</span></div>
 <div class="fgrid"><label>Search<input id="ms" type="search" placeholder="Search dishes" value="${esc(S.mq.s)}"></label></div>
 <div class="chips" id="mcats">${['All',...db.cats].map(c=>`<button class="chip ${S.mq.cat===c?'on':''}" data-a="mcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="menulist">${menuList()}</div></div></section>`}};
/* ===== Cart & ordering ===== */
function cartAdd(it){const k=it.id+'|'+(it.opts||[]).join(',')+'|'+(it.note||'');const x=S.cart.find(c=>c.k===k);x?x.qty+=it.qty:S.cart.push({...it,k});header();toast(db.menu.find(m=>m.id===it.id).name+' added to your order')}
S.o={type:'DELIVERY',area:'',time:'',name:'',phone:'',addr:'',land:'',instr:''};
PAGES.order={html(){if(S.placed)return orderDone();const o=S.o;const areas=db.areas.filter(a=>a.active);if(!areas.some(a=>a.id===o.area))o.area=areas[0]?areas[0].id:'';
 if(!db.settings.delivery)o.type='COLLECTION';const p=priceOrder(S.cart,o.type,o.area);
 if(!S.cart.length)return`<section class="band"><div class="wrap stack"><span class="eyebrow">Order food</span><h2>Your order is empty</h2><div class="empty">Pick something from the menu and it will appear here.<br><br><a class="btn" href="#menu">Explore Our Menu</a></div></div></section>`;
 return`<section class="band"><div class="wrap stack"><span class="eyebrow">Order food</span><h2>Your order</h2><div class="split"><form class="stack" data-form="order">
 <div class="panel stack"><h3>Items</h3>${S.cart.map((c,i)=>{const f=db.menu.find(m=>m.id===c.id);return`<div class="line" style="align-items:center"><div style="min-width:0"><b>${esc(f.name)}</b><div class="small muted">${esc((c.opts||[]).join(', '))}${c.note?' · '+esc(c.note):''}</div></div><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn sm ghost" data-a="qty" data-v="${i}:-1" aria-label="Fewer">&minus;</button><b>${c.qty}</b><button type="button" class="btn sm ghost" data-a="qty" data-v="${i}:1" aria-label="More">+</button><button type="button" class="btn sm ghost" data-a="rm" data-v="${i}">Remove</button></div></div>`}).join('')}</div>
 <div class="panel stack"><h3>Delivery or collection</h3><div class="chips">${db.settings.delivery?`<button type="button" class="chip ${o.type==='DELIVERY'?'on':''}" data-a="otype" data-v="DELIVERY">Delivery</button>`:''}<button type="button" class="chip ${o.type==='COLLECTION'?'on':''}" data-a="otype" data-v="COLLECTION">Collection</button></div>
 <div class="fgrid"><label>Name<input id="on" required value="${esc(o.name)}"></label><label>Phone<input id="op" required value="${esc(o.phone)}" inputmode="tel"></label></div>
 ${o.type==='DELIVERY'?`<div class="fgrid"><label>Delivery area<select id="oa">${areas.map(a=>`<option value="${a.id}" ${a.id===o.area?'selected':''}>${esc(a.name)} (${kes(a.fee)})</option>`).join('')}</select></label><label>Landmark<input id="ol" value="${esc(o.land)}"></label></div><label>Detailed address<input id="oad" required value="${esc(o.addr)}"></label><label>Delivery instructions (optional)<input id="oi" value="${esc(o.instr)}"></label>`:'<p class="small muted">Collect from reception. We will show your order reference when it is placed.</p>'}
 <label>Preferred time<select id="ot"><option value="">As soon as possible</option>${slots().map(t=>`<option ${o.time===t?'selected':''}>${t}</option>`).join('')}</select></label></div>
 <div class="panel stack">${payChoices('food')}</div></form>
 <aside class="panel stack" style="position:sticky;top:90px"><h3>Summary</h3>${p.error?`<p class="err">${esc(p.error)}</p>`:`<div class="line"><span>Subtotal</span><span>${kes(p.sub)}</span></div><div class="line"><span>${o.type==='DELIVERY'?'Delivery fee':'Collection'}</span><span>${kes(p.fee)}</span></div><div class="line tot"><span>Total</span><span>${kes(p.total)}</span></div>${p.min&&p.sub<p.min?`<p class="err small">Minimum order for this area is ${kes(p.min)}.</p>`:''}`}
 ${isOpen()?'':`<p class="err small">The kitchen is closed (${esc(db.settings.openFrom)} to ${esc(db.settings.openTo)}). You may still schedule an order.</p>`}
 <p class="small muted">Prices are recalculated from the menu when you place the order.</p><button class="btn gold" data-a="placeOrder" ${p.error?'disabled':''}>Place order</button></aside></div></div></section>`}};
function slots(){const out=[];let [h,m]=db.settings.openFrom.split(':').map(Number);const [eh]=db.settings.openTo.split(':').map(Number);for(;h<eh;h++){out.push(String(h).padStart(2,'0')+':00');out.push(String(h).padStart(2,'0')+':30')}return out}
function orderDone(){const o=S.placed;return`<section class="band"><div class="wrap stack" style="max-width:640px"><span class="eyebrow">Order received</span><h2>Thank you, ${esc(o.name)}</h2><div class="panel stack"><p>Your order reference</p><h1 style="font-size:2.4rem;color:var(--gold)">${o.ref}</h1><p class="small muted">Keep this reference to track your order. ${o.type==='DELIVERY'?'Estimated delivery in about '+(db.areas.find(a=>a.id===o.area)||{mins:45}).mins+' minutes.':'We will mark it ready for collection.'}</p><div class="line tot"><span>Total</span><span>${kes(o.total)}</span></div><div class="row">${pill(o.status)}${pill(o.pay.status)}</div><div class="row"><a class="btn" href="#reservations" data-a="trackThis" data-v="${o.ref}">Track order</a><a class="btn ghost" href="#menu">Order more</a></div></div></div></section>`}
/* ===== Tracking ===== */
S.look={kind:'room',ref:'',contact:'',found:null};
function statusFlow(o){return o.type==='DELIVERY'?['PENDING','CONFIRMED','PREPARING','OUT_FOR_DELIVERY','DELIVERED']:['PENDING','CONFIRMED','PREPARING','READY_FOR_COLLECTION','DELIVERED']}
function trackView(){const f=S.look.found;if(!f)return S.look.err?`<p class="err">${esc(S.look.err)}</p>`:'';
 if(f.kind==='room'){const r=f.rec,rm=db.rooms.find(x=>x.id===r.roomId)||{name:'Room'};return`<div class="panel stack"><div class="line"><h3>${r.ref}</h3>${pill(r.status)}</div><div class="line"><span>Room</span><b>${esc(rm.name)}</b></div><div class="line"><span>Stay</span><b>${fdate(r.in)} to ${fdate(r.out)} (${r.nights} night${r.nights>1?'s':''})</b></div><div class="line"><span>Guests</span><span>${r.adults} adults, ${r.children} children</span></div><div class="line"><span>Total</span><b>${kes(r.total)}</b></div><div class="line"><span>Payment</span><span>${pill(r.pay.status)} <span class="small muted">${esc(r.pay.method)} ${esc(r.pay.ref)}</span></span></div>${['PENDING','CONFIRMED'].includes(r.status)?`<button class="btn danger sm" style="align-self:flex-start" data-a="cancelRes" data-v="${r.ref}">Cancel booking</button><p class="small muted">${esc(db.settings.cancelNote)}</p>`:''}</div>`}
 const o=f.rec,fl=statusFlow(o),ix=fl.indexOf(o.status);return`<div class="panel stack"><div class="line"><h3>${o.ref}</h3>${pill(o.status)}</div>${o.status==='CANCELLED'?'<p class="err">This order was cancelled.</p>':`<ol style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px">${fl.map((s,i)=>`<li style="display:flex;gap:10px;align-items:center;color:${i<=ix?'var(--fg)':'var(--mute)'}"><span style="width:14px;height:14px;border-radius:50%;background:${i<=ix?'var(--goldl)':'var(--line)'}"></span>${lbl(s)}</li>`).join('')}</ol>`}
 ${o.items.map(i=>`<div class="line small"><span>${i.qty} x ${esc(i.name)}</span><span>${kes(i.total)}</span></div>`).join('')}<div class="line tot"><span>Total</span><span>${kes(o.total)}</span></div><div class="line"><span>Payment</span><span>${pill(o.pay.status)} <span class="small muted">${esc(o.pay.method)}</span></span></div>
 ${o.status!=='DELIVERED'&&o.status!=='CANCELLED'?`<button class="btn ghost sm" style="align-self:flex-start" data-a="simNext" data-v="${o.ref}">Simulate next status (demo)</button><p class="small muted">Real status updates come from kitchen staff. This button only simulates one for the presentation.</p>`:''}</div>`}
PAGES.reservations={html(){const L=S.look,u=S.user;const mine=u&&u.role==='CUSTOMER'?{r:db.reservations.filter(r=>r.email===u.email||r.phone===u.phone),o:db.orders.filter(o=>o.phone===u.phone)}:null;
 return`<section class="band"><div class="wrap stack" style="max-width:760px"><span class="eyebrow">Reservations</span><h2>Track a booking or food order</h2><form class="panel stack" data-form="look"><div class="chips"><button type="button" class="chip ${L.kind==='room'?'on':''}" data-a="lookKind" data-v="room">Room booking</button><button type="button" class="chip ${L.kind==='food'?'on':''}" data-a="lookKind" data-v="food">Food order</button></div><div class="fgrid"><label>Reference<input id="lr" required placeholder="${L.kind==='room'?'RB-DEMO01':'FO-DEMO01'}" value="${esc(L.ref)}"></label><label>Phone or email used<input id="lc" required value="${esc(L.contact)}" placeholder="${L.kind==='room'?'0700 000 001':'0700 000 011'}"></label></div><button class="btn" style="align-self:flex-start">Find</button><p class="small muted">Sample references to try: RB-DEMO01 with 0700 000 001, FO-DEMO01 with 0700 000 011.</p></form><div id="trk">${trackView()}</div>
 ${mine?`<h3>Your history</h3>${mine.r.length+mine.o.length?`<div class="tw"><table><tr><th>Ref</th><th>Type</th><th>Status</th><th>Total</th></tr>${mine.r.map(r=>`<tr><td>${r.ref}</td><td>Room</td><td>${pill(r.status)}</td><td>${kes(r.total)}</td></tr>`).join('')}${mine.o.map(o=>`<tr><td>${o.ref}</td><td>Food</td><td>${pill(o.status)}</td><td>${kes(o.total)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No bookings or orders on this account yet.</div>'}`:''}</div></section>`}};
/* ===== Account / demo sign-in ===== */
PAGES.account={html(){const u=S.user;if(u)return`<section class="band"><div class="wrap stack" style="max-width:640px"><span class="eyebrow">My account</span><h2>Hello, ${esc(u.name)}</h2><div class="panel stack"><div class="line"><span>Role</span><b>${ROLES[u.role]}</b></div>${u.email?`<div class="line"><span>Email</span><span>${esc(u.email)}</span></div>`:''}<div class="row">${u.role!=='CUSTOMER'?'<a class="btn gold" href="#admin">Open dashboard</a>':'<a class="btn" href="#reservations">My bookings and orders</a>'}<button class="btn ghost" data-a="logout">Sign out</button></div></div></div></section>`;
 return`<section class="band"><div class="wrap split"><div class="stack"><span class="eyebrow">Login</span><h2>Staff demo access</h2><p class="lead">This prototype has no real passwords. Pick a role to see what each team member can access. In the production build staff sign in with hashed passwords and server-side sessions.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${['ADMIN','RECEPTION','RESTAURANT'].map(r=>`<button class="panel stack" style="text-align:left;cursor:pointer" data-a="demoLogin" data-v="${r}"><b>${ROLES[r]}</b><span class="small muted">${r==='ADMIN'?'Everything':r==='RECEPTION'?'Rooms, bookings, media, customers':'Menu and food orders only'}</span></button>`).join('')}</div></div>
 <form class="panel stack" data-form="custLogin"><h3>Customer sign in</h3><label>Name<input id="cln" required></label><label>Email<input id="cle" type="email" required></label><label>Phone<input id="clp" required inputmode="tel"></label><button class="btn">Continue</button><p class="small muted">Guests can book and order without an account.</p></form></div></section>`}};
</script>
<script>
/* ===== Admin dashboard ===== */
S.tab='dash';S.af={};
const TABS=[['dash','Overview'],['media','Media'],['rooms','Rooms'],['bookings','Bookings'],['menu','Menu'],['orders','Orders'],['customers','Customers'],['reports','Reports'],['settings','Settings']];
function revenue(){const real=[...db.reservations,...db.orders].filter(x=>x.pay.status==='PAID'&&!x.pay.demo).reduce((a,x)=>a+x.total,0);const demo=[...db.reservations,...db.orders].filter(x=>x.pay.demo&&x.pay.status.startsWith('PAID')).reduce((a,x)=>a+x.total,0);return{real,demo}}
function aDash(){const t=today();const R=db.reservations,O=db.orders;const occ=R.filter(r=>r.status==='CHECKED_IN'||(r.status==='CONFIRMED'&&r.in<=t&&r.out>t)).length;const act=db.rooms.filter(r=>r.active).length;const rv=revenue();
 const arr=R.filter(r=>r.in===t&&['PENDING','CONFIRMED'].includes(r.status)),dep=R.filter(r=>r.out>=t&&r.out<=addDays(t,3)&&['CONFIRMED','CHECKED_IN'].includes(r.status));
 const to=O.filter(o=>iso(o.created)===t).length,po=O.filter(o=>o.status==='PENDING').length;
 const k=(a,b,c)=>`<div class="kpi"><small>${a}</small><b>${b}</b>${c?`<span class="small muted">${c}</span>`:''}</div>`;
 const days=[...Array(7)].map((_,i)=>addDays(t,i-6)),sales=days.map(d=>O.filter(o=>iso(o.created)===d&&o.status!=='CANCELLED').reduce((a,o)=>a+o.total,0)+R.filter(r=>iso(r.created)===d&&r.status!=='CANCELLED').reduce((a,r)=>a+r.total,0));
 const mx=Math.max(...sales,1);
 return`<h2>Overview</h2><div class="kpis">${k('Total bookings',R.length,'sample data')}${k("Today's arrivals",arr.length)}${k('Upcoming departures',dep.length,'next 3 days')}${k('Occupied rooms',occ+' / '+act,(act-occ)+' available')}${k("Today's food orders",to)}${k('Pending food orders',po)}${k('Revenue (verified)',kes(rv.real),'real payments only')}${k('Demo revenue',kes(rv.demo),'simulated, not real')}</div>
 ${can('bookings')||can('orders')?`<div class="panel stack"><b>Activity, last 7 days (KES, bookings plus orders, sample)</b><svg viewBox="0 0 560 150" style="width:100%;max-width:100%" role="img" aria-label="Seven day activity chart">${sales.map((v,i)=>{const h=v/mx*100;return`<rect x="${20+i*76}" y="${115-h}" width="48" height="${h}" fill="var(--gold)" opacity=".85"/><text x="${44+i*76}" y="134" text-anchor="middle" font-size="11" fill="var(--mute)">${days[i].slice(5)}</text>${v?`<text x="${44+i*76}" y="${108-h}" text-anchor="middle" font-size="10" fill="var(--fg)">${Math.round(v/1000)}k</text>`:''}`}).join('')}<line x1="10" x2="550" y1="115" y2="115" stroke="var(--line)"/></svg></div>`:''}
 <div class="panel stack"><b>Recent activity</b>${db.audit.length?`<div class="tw"><table>${db.audit.slice(0,8).map(a=>`<tr><td class="small muted" style="white-space:nowrap">${ftime(a.t)}</td><td>${esc(a.a)}</td><td class="small muted">${esc(a.by)}</td></tr>`).join('')}</table></div>`:'<p class="small muted">Actions taken by staff will appear here.</p>'}</div>`}
function aMedia(){return`<div class="row" style="justify-content:space-between"><h2>Media library</h2><label class="btn" style="cursor:pointer">Upload photo or video<input type="file" id="mup" accept="image/jpeg,image/png,image/webp,video/mp4" hidden></label></div><p class="small muted">Allowed: JPG, PNG, WebP up to 8 MB and MP4 up to 25 MB in this preview. Slideshow order follows the list below.</p>
 <div class="mgrid">${db.media.map((m,i)=>`<div class="card" style="opacity:${m.active?1:.55}"><div class="ph">${m.type==='video'?`<video src="${esc(m.src)}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>`:`<img src="${esc(m.src)}" alt="${esc(m.title)}" loading="lazy">`}${m.placeholder?'<span class="sample">Placeholder</span>':''}</div><div class="bd"><b class="small">${esc(m.title)}</b><span class="small muted">${m.type==='video'?'Video':'Photo'} · ${lbl(m.cat)}</span><div class="row"><label style="flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0"><input type="checkbox" style="width:auto" data-a="mSlide" data-v="${m.id}" ${m.slide?'checked':''}>Slideshow</label><label style="flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0"><input type="checkbox" style="width:auto" data-a="mActive" data-v="${m.id}" ${m.active?'checked':''}>Active</label></div><div class="row"><button class="btn sm ghost" data-a="mMove" data-v="${i}:-1" aria-label="Move earlier">&#8592;</button><button class="btn sm ghost" data-a="mMove" data-v="${i}:1" aria-label="Move later">&#8594;</button><button class="btn sm ghost" data-a="mDel" data-v="${m.id}" style="margin-left:auto">Delete</button></div></div></div>`).join('')}</div>`}
function aRooms(){return`<div class="row" style="justify-content:space-between"><h2>Rooms</h2><button class="btn" data-a="roomForm" data-v="">Add room</button></div><div class="tw panel"><table><tr><th>Room</th><th>Price</th><th>Sleeps</th><th>Status</th><th></th></tr>${db.rooms.map(r=>`<tr><td><div class="row" style="flex-wrap:nowrap"><img class="thumb" src="${esc(mediaSrc(r.img))}" alt=""><b>${esc(r.name)}</b></div></td><td>${kes(r.price)}</td><td>${r.adults}+${r.children}</td><td>${r.active?pill('CONFIRMED').replace('Confirmed','Listed'):'<span class="pill">Hidden</span>'}${r.blocks.length?'<br><span class="small muted">'+r.blocks.length+' block(s)</span>':''}</td><td><div class="row"><button class="btn sm ghost" data-a="roomForm" data-v="${r.id}">Edit</button><button class="btn sm ghost" data-a="roomBlock" data-v="${r.id}">Block dates</button><button class="btn sm ghost" data-a="roomDel" data-v="${r.id}">Remove</button></div></td></tr>`).join('')}</table></div>`}
function aBookings(){const f=S.af.b||'',st=S.af.bs||'';const L=db.reservations.filter(r=>(!st||r.status===st)&&(!f||(r.ref+r.name+r.phone+(db.rooms.find(x=>x.id===r.roomId)||{}).name).toLowerCase().includes(f.toLowerCase()))).sort((a,b)=>a.in<b.in?-1:1);
 return`<h2>Bookings</h2><div class="fgrid"><label>Search<input id="bf" value="${esc(f)}" placeholder="Name, reference, room"></label><label>Status<select id="bs"><option value="">All</option>${RS.map(s=>`<option value="${s}" ${st===s?'selected':''}>${lbl(s)}</option>`).join('')}</select></label></div>
 <div class="tw panel"><table><tr><th>Ref</th><th>Guest</th><th>Room</th><th>Stay</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr>${L.map(r=>`<tr><td>${r.ref}${r.sample?'<br><span class="small muted">sample</span>':''}</td><td>${esc(r.name)}<br><span class="small muted">${esc(r.phone)}</span></td><td>${esc((db.rooms.find(x=>x.id===r.roomId)||{}).name)}</td><td style="white-space:nowrap">${fdate(r.in)}<br>${fdate(r.out)}</td><td>${kes(r.total)}</td><td>${pill(r.status)}</td><td>${pill(r.pay.status)}</td><td><select data-a="resStatus" data-v="${r.ref}" aria-label="Update status">${RS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${lbl(s)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">No bookings match.</div></td></tr>'}</table></div>`}

function aOrders(){const f=S.af.o||'',st=S.af.os||'';const L=db.orders.filter(o=>(!st||o.status===st)&&(!f||(o.ref+o.name+o.phone).toLowerCase().includes(f.toLowerCase()))).sort((a,b)=>b.created-a.created);
 return`<h2>Food orders</h2><div class="fgrid"><label>Search<input id="of" value="${esc(f)}" placeholder="Name, phone, reference"></label><label>Status<select id="os"><option value="">All</option>${OS.map(s=>`<option value="${s}" ${st===s?'selected':''}>${lbl(s)}</option>`).join('')}</select></label></div>

 <div class="row">${o.status==='PENDING'?`<button class="btn sm" data-a="ordSet" data-v="${o.ref}:CONFIRMED">Confirm</button><button class="btn sm danger" data-a="ordSet" data-v="${o.ref}:CANCELLED">Reject</button>`:''}<select data-a="ordStatus" data-v="${o.ref}" aria-label="Update status">${OS.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${lbl(s)}</option>`).join('')}</select></div></div>`).join('')||'<div class="empty">No orders match.</div>'}</div>`}
function aCustomers(){const m=new Map();const add=(n,p,e)=>{const k=p||e;if(!m.has(k))m.set(k,{n,p,e,b:0,o:0,sp:0});return m.get(k)};
 db.reservations.forEach(r=>{const c=add(r.name,r.phone,r.email);c.b++;if(r.status!=='CANCELLED')c.sp+=r.total});db.orders.forEach(o=>{const c=add(o.name,o.phone,'');c.o++;if(o.status!=='CANCELLED')c.sp+=o.total});
 return`<h2>Customers</h2><p class="small muted">Only name, phone and email are stored. Access is limited to authorised staff.</p><div class="tw panel"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Bookings</th><th>Orders</th><th>Total value</th></tr>${[...m.values()].map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.p)}</td><td>${esc(c.e||'-')}</td><td>${c.b}</td><td>${c.o}</td><td>${kes(c.sp)}</td></tr>`).join('')}</table></div>
 ${(db.messages||[]).length?`<h3>Contact messages</h3><div class="panel stack">${db.messages.map(x=>`<div><b>${esc(x.name)}</b> <span class="small muted">${esc(x.contact)} · ${ftime(x.t)}</span><p>${esc(x.msg)}</p></div>`).join('')}</div>`:''}`}
function aReports(){const t=today(),ym=t.slice(0,7);const R=db.reservations.filter(r=>r.status!=='CANCELLED'&&r.status!=='REJECTED'),O=db.orders.filter(o=>o.status!=='CANCELLED');
 const sum=(a,f)=>a.filter(f).reduce((s,x)=>s+x.total,0);const rv=revenue();
 const occ=db.rooms.filter(r=>r.active).map(r=>{const days=[...Array(30)].map((_,i)=>addDays(t,i)).filter(d=>!roomFree(r.id,d,addDays(d,1))).length;return[r.name,days]});
 return`<div class="row" style="justify-content:space-between"><h2>Reports</h2><div class="row"><button class="btn ghost" data-a="exp" data-v="bookings">Export bookings CSV</button><button class="btn ghost" data-a="exp" data-v="orders">Export orders CSV</button></div></div>
 <div class="kpis"><div class="kpi"><small>Bookings today</small><b>${R.filter(r=>iso(r.created)===t).length}</b></div><div class="kpi"><small>Bookings this month</small><b>${R.filter(r=>iso(r.created).startsWith(ym)).length}</b></div><div class="kpi"><small>Food orders this month</small><b>${O.filter(o=>iso(o.created).startsWith(ym)).length}</b></div><div class="kpi"><small>Room value (all)</small><b>${kes(sum(R,()=>1))}</b></div><div class="kpi"><small>Food sales (all)</small><b>${kes(sum(O,()=>1))}</b></div><div class="kpi"><small>Verified revenue</small><b>${kes(rv.real)}</b><span class="small muted">Demo payments excluded (${kes(rv.demo)})</span></div></div>
 <div class="panel stack"><b>Occupancy, next 30 nights</b>${occ.map(([n,d])=>`<div class="line small"><span style="min-width:130px">${esc(n)}</span><div style="flex:1;background:var(--skyl);height:12px;align-self:center"><div style="width:${d/30*100}%;background:var(--navy2);height:100%"></div></div><span>${d}/30</span></div>`).join('')}</div>`}
function aSettings(){const s=db.settings;const f=(k,l,t)=>`<label>${l}<input data-s="${k}" value="${esc(s[k])}" ${t||''}></label>`;
 return`<h2>Settings</h2><form class="panel stack" data-form="settings"><h3>Hotel details</h3><div class="fgrid">${f('name','Hotel name')}${f('phone','Phone')}${f('whatsapp','WhatsApp')}${f('email','Email')}${f('location','Physical location')}${f('hours','Business hours')}</div>
 <h3>Restaurant and delivery</h3><div class="fgrid">${f('openFrom','Kitchen opens','type="time"')}${f('openTo','Kitchen closes','type="time"')}${f('cancelHours','Free cancellation (hours before check-in)','type="number" min="0"')}</div>
 <div class="row">${[['delivery','Delivery enabled'],['payAtHotel','Pay at hotel enabled'],['payOnCollection','Pay on collection enabled']].map(([k,l])=>`<label style="flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0"><input type="checkbox" style="width:auto" data-c="${k}" ${s[k]?'checked':''}>${l}</label>`).join('')}</div>
 <label>Cancellation rules text<textarea data-s="cancelNote" rows="2">${esc(s.cancelNote)}</textarea></label><button class="btn" style="align-self:flex-start">Save settings</button></form>
 <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>Delivery areas</h3><button class="btn sm" data-a="areaForm" data-v="">Add area</button></div><div class="tw"><table><tr><th>Area</th><th>Fee</th><th>Minimum order</th><th>Estimate</th><th>Active</th><th></th></tr>${db.areas.map(a=>`<tr><td>${esc(a.name)}</td><td>${kes(a.fee)}</td><td>${kes(a.min)}</td><td>${a.mins} min</td><td><input type="checkbox" style="width:auto" data-a="areaOn" data-v="${a.id}" ${a.active?'checked':''} aria-label="Active"></td><td><button class="btn sm ghost" data-a="areaForm" data-v="${a.id}">Edit</button></td></tr>`).join('')}</table></div></div>
 <div class="panel stack"><h3>Demo data</h3><p class="small muted">Reset restores the sample rooms, menu, bookings and orders and removes anything you added.</p><button class="btn danger" style="align-self:flex-start" data-a="reset">Reset demo data</button></div>`}

PAGES.admin={html(){if(!S.user||S.user.role==='CUSTOMER')return`<section class="band"><div class="wrap"><div class="empty">Staff access only. <a href="#account">Sign in</a> with a staff role.</div></div></section>`;
 if(!can(S.tab))S.tab='dash';return`<div class="adm"><nav class="side" aria-label="Dashboard">${TABS.filter(t=>can(t[0])).map(([k,l])=>`<a data-a="tab" data-v="${k}" class="${S.tab===k?'on':''}" tabindex="0" role="button">${l}</a>`).join('')}<span class="small" style="padding:14px 12px;opacity:.7">${ROLES[S.user.role]}</span></nav><main class="amain" id="amain">${ATAB[S.tab]()}</main></div>`}};

</script>
<script>
/* ===== Actions ===== */
const A={},F={};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const norm=s=>String(s||'').replace(/[\s\-()]/g,'').toLowerCase();
function readOrder(){const o=S.o;[['on','name'],['op','phone'],['oa','area'],['oad','addr'],['ol','land'],['oi','instr'],['ot','time']].forEach(([i,k])=>{const e=document.getElementById(i);if(e)o[k]=e.value})}

function rerender(){keepScroll(()=>{const p=PAGES[S.route];$('#app').innerHTML=p.html()+cookieBar();header()})}
A.burger=(v,e)=>{const n=$('#nav');const o=n.classList.toggle('open');e.setAttribute('aria-expanded',o)};

A.slPlay=(v,e)=>{slPlaying=!slPlaying;e.innerHTML=slPlaying?'&#10074;&#10074;':'&#9654;';e.setAttribute('aria-label',slPlaying?'Pause slideshow':'Play slideshow');slStart()};
/* rooms */
A.reserve=id=>{const r=db.rooms.find(x=>x.id===id),q=S.q,n=nights(q.in,q.out);if(!r)return;
 modal(`<h3>Reserve ${esc(r.name)}</h3><div class="panel stack small"><div class="line"><span>${fdate(q.in)} to ${fdate(q.out)}</span><span>${n} night${n>1?'s':''}</span></div><div class="line"><span>${q.ad} adults, ${q.ch} children</span><b>${kes(r.price*n)}</b></div></div><form class="stack" data-form="reserve" data-v="${id}"><label>Full name<input id="rn" required></label><label>Phone<input id="rp" required inputmode="tel"></label><label>Email<input id="re" type="email" required></label>${payChoices('room')}<p class="small muted">${esc(db.settings.cancelNote)}</p><div class="row"><button class="btn gold">Submit reservation</button><button type="button" class="btn ghost" data-a="closeModal">Cancel</button></div></form>`)};
F.reserve=(f)=>{const id=f.dataset.v,q=S.q,r=db.rooms.find(x=>x.id===id);const n=nights(q.in,q.out);
 if(!r||!roomFree(id,q.in,q.out)){toast('Sorry, that room was just booked for these dates.','bad');closeModal();$('#roomlist')&&($('#roomlist').innerHTML=roomsList());return}
 const m=(f.querySelector('input[name=pm]:checked')||{}).value||'Pay at hotel';
 const rec={ref:ref('RB'),roomId:id,name:val('rn'),phone:val('rp'),email:val('re'),in:q.in,out:q.out,nights:n,adults:q.ad,children:q.ch,total:n*r.price,status:'PENDING',pay:payRecord(m),created:Date.now()};
 db.reservations.push(rec);rememberCustomer(rec.name,rec.phone,rec.email);audit('Booking created '+rec.ref,'');save();
 modal(`<h3>Reservation received</h3><p>Your booking reference</p><h1 style="color:var(--gold);font-size:2.2rem">${rec.ref}</h1><p class="small muted">Status: Pending. The hotel will confirm your booking. Use this reference with your phone number to track it. ${rec.pay.demo?'Payment was simulated (DEMO). No money moved.':''}</p><div class="row"><a class="btn" href="#reservations" data-a="closeModal">Track booking</a><button class="btn ghost" data-a="closeModal">Close</button></div>`);
 S.look={kind:'room',ref:rec.ref,contact:rec.phone,found:{kind:'room',rec}};$('#roomlist')&&($('#roomlist').innerHTML=roomsList())};
/* menu and cart */
A.mcat=(v)=>{S.mq.cat=v;$$('#mcats .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));$('#menulist').innerHTML=menuList()};
A.addItem=id=>{const f=db.menu.find(m=>m.id===id);if(!f)return;
 modal(`<h3>${esc(f.name)}</h3><p class="small muted">${esc(f.desc)}</p><form class="stack" data-form="addItem" data-v="${id}">${f.opts.length?`<fieldset style="border:1px solid var(--line);padding:10px"><legend class="small muted">Add-ons</legend>${f.opts.map(o=>`<label style="flex-direction:row;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" name="op" value="${esc(o.n)}" style="width:auto">${esc(o.n)} (+${kes(o.p)})</label>`).join('')}</fieldset>`:''}<label>Quantity<input id="aq" type="number" min="1" max="20" value="1"></label><label>Special instructions<input id="an" placeholder="For example: no onions"></label><div class="row"><button class="btn gold">Add to order</button><button type="button" class="btn ghost" data-a="closeModal">Cancel</button></div></form>`)};

A.placeOrder=()=>{readOrder();const o=S.o;if(!S.cart.length)return;
 if(!o.name||!o.phone||(o.type==='DELIVERY'&&(!o.addr||!o.area))){toast('Please complete your name, phone and delivery address.','bad');return}
 const p=priceOrder(S.cart,o.type,o.area);if(p.error){toast(p.error,'bad');return}
 if(p.min&&p.sub<p.min){toast('Minimum order for this area is '+kes(p.min),'bad');return}
 const m=(($('input[name=pm]:checked')||{}).value)||'Pay on collection';
 const rec={ref:ref('FO'),items:p.lines,type:o.type,area:o.type==='DELIVERY'?o.area:'',name:o.name,phone:o.phone,addr:o.addr+(o.land?' (near '+o.land+')':''),instr:o.instr,time:o.time,sub:p.sub,fee:p.fee,total:p.total,status:'PENDING',pay:payRecord(m),created:Date.now()};
 db.orders.push(rec);rememberCustomer(o.name,o.phone,'');audit('Food order placed '+rec.ref,'');save();S.cart=[];S.placed=rec;render()};
/* tracking */
A.lookKind=v=>{S.look={kind:v,ref:'',contact:'',found:null};rerender()};
A.trackThis=(v)=>{const o=db.orders.find(x=>x.ref===v);S.placed=null;S.look={kind:'food',ref:o.ref,contact:o.phone,found:{kind:'food',rec:o}}};

 if(L.kind==='room'){const x=db.reservations.find(a=>a.ref===r&&(norm(a.phone)===c||norm(a.email)===c));x?L.found={kind:'room',rec:x}:L.err='No booking matches that reference and contact. Check both and try again.'}
 else{const x=db.orders.find(a=>a.ref===r&&norm(a.phone)===c);x?L.found={kind:'food',rec:x}:L.err='No order matches that reference and phone number. Check both and try again.'}
 $('#trk').innerHTML=trackView()};
A.cancelRes=v=>confirmBox('Cancel booking '+v+'? This cannot be undone.',()=>{const r=db.reservations.find(x=>x.ref===v);r.status='CANCELLED';audit('Booking cancelled by guest '+v);save();S.look.found={kind:'room',rec:r};$('#trk').innerHTML=trackView();toast('Booking cancelled')},'Cancel booking');

function setUser(u){S.user=u;try{sessionStorage.setItem('rosablu-user',JSON.stringify(u))}catch(e){}}

 if(!vid&&!img){toast('Only JPG, PNG, WebP or MP4 files are allowed.','bad');return}

const chk=(id,l,on)=>`<label style="flex-direction:row;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="${id}" type="checkbox" style="width:auto" ${on?'checked':''}>${l}</label>`;
A.roomForm=v=>{const r=db.rooms.find(x=>x.id===v)||{name:'',price:8000,adults:2,children:1,desc:'',amen:['Wi-Fi'],active:true,img:''};
 modal(`<h3>${v?'Edit':'Add'} room</h3><form class="stack" data-form="roomSave" data-v="${v}"><label>Name<input id="fn" required value="${esc(r.name)}"></label><div class="fgrid"><label>Price per night (KES)<input id="fp" type="number" min="0" required value="${r.price}"></label><label>Adults<input id="fa" type="number" min="1" value="${r.adults}"></label><label>Children<input id="fc" type="number" min="0" value="${r.children}"></label></div><label>Description<textarea id="fd" rows="3">${esc(r.desc)}</textarea></label><label>Amenities (comma separated)<input id="fm" value="${esc(r.amen.join(', '))}"></label><label>Photograph<select id="fi">${imgOpts(r.img)}</select></label>${chk('fv','Listed on the website',r.active)}<div class="row"><button class="btn">Save room</button><button type="button" class="btn ghost" data-a="closeModal">Cancel</button></div></form>`)};
F.roomSave=f=>{const id=f.dataset.v,d={name:val('fn'),price:+val('fp'),adults:+val('fa')||1,children:+val('fc')||0,desc:val('fd'),amen:val('fm').split(',').map(s=>s.trim()).filter(Boolean),img:val('fi'),active:$('#fv').checked};
 if(id)Object.assign(db.rooms.find(x=>x.id===id),d);else db.rooms.push({...d,id:'r'+uid(),blocks:[]});touch('Room saved: '+d.name);closeModal();aRefresh();toast('Room saved')};
A.roomBlock=v=>{const r=db.rooms.find(x=>x.id===v);modal(`<h3>Block ${esc(r.name)}</h3><form class="stack" data-form="blockSave" data-v="${v}"><div class="fgrid"><label>From<input id="bf1" type="date" required></label><label>Until (check-out day)<input id="bf2" type="date" required></label></div><label>Reason<input id="br" placeholder="Maintenance"></label><button class="btn">Block dates</button></form>${r.blocks.length?`<h4>Current blocks</h4>${r.blocks.map((b,i)=>`<div class="line small"><span>${fdate(b.from)} to ${fdate(b.to)} ${esc(b.reason)}</span><button class="btn sm ghost" data-a="blkDel" data-v="${v}:${i}">Remove</button></div>`).join('')}`:''}`)};
F.blockSave=f=>{const r=db.rooms.find(x=>x.id===f.dataset.v),a=val('bf1'),b=val('bf2');if(b<=a){toast('End date must be after the start date.','bad');return}
 if(db.reservations.some(x=>x.roomId===r.id&&ACTIVE.includes(x.status)&&a<x.out&&x.in<b)){toast('Active bookings exist in that period. Move or cancel them first.','bad');return}
 r.blocks.push({from:a,to:b,reason:val('br')});touch('Room blocked: '+r.name);closeModal();aRefresh();toast('Dates blocked')};
A.blkDel=v=>{const[id,i]=v.split(':');db.rooms.find(x=>x.id===id).blocks.splice(+i,1);touch('Room block removed');closeModal();aRefresh()};
A.roomDel=v=>{const r=db.rooms.find(x=>x.id===v);if(db.reservations.some(x=>x.roomId===v&&ACTIVE.includes(x.status))){toast('This room has active bookings. Hide it instead.','bad');return}
 confirmBox('Remove '+r.name+'? Past bookings keep their record.',()=>{db.rooms=db.rooms.filter(x=>x.id!==v);touch('Room removed: '+r.name);aRefresh()},'Remove')};
A.resStatus=(v,e)=>{const r=db.reservations.find(x=>x.ref===v),s=e.value;
 if(ACTIVE.includes(s)&&!ACTIVE.includes(r.status)&&!roomFree(r.roomId,r.in,r.out,r.ref)){toast('Cannot restore: those dates now overlap another booking.','bad');aRefresh();return}
 r.status=s;touch('Booking '+v+' set to '+lbl(s));aRefresh();toast('Booking '+lbl(s).toLowerCase())};
A.catForm=()=>modal(`<h3>Menu categories</h3><form class="stack" data-form="catSave"><label>One per line<textarea id="fcl" rows="10">${esc(db.cats.join('\n'))}</textarea></label><button class="btn">Save categories</button></form>`);
F.catSave=()=>{const L=val('fcl').split('\n').map(s=>s.trim()).filter(Boolean);const miss=[...new Set(db.menu.map(m=>m.cat))].filter(c=>!L.includes(c));if(miss.length){toast('Items still use: '+miss.join(', ')+'. Move them first.','bad');return}db.cats=L;touch('Categories saved');closeModal();aRefresh()};
A.itemForm=v=>{const m=db.menu.find(x=>x.id===v)||{name:'',cat:db.cats[0],price:500,offer:null,desc:'',opts:[],avail:true,img:''};
 modal(`<h3>${v?'Edit':'Add'} menu item</h3><form class="stack" data-form="itemSave" data-v="${v}"><label>Name<input id="in1" required value="${esc(m.name)}"></label><div class="fgrid"><label>Category<select id="in2">${db.cats.map(c=>`<option ${c===m.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Price (KES)<input id="in3" type="number" min="0" required value="${m.price}"></label><label>Offer price (optional)<input id="in4" type="number" min="0" value="${m.offer||''}"></label></div><label>Description<textarea id="in5" rows="2">${esc(m.desc)}</textarea></label><label>Add-ons (Name:price, comma separated)<input id="in6" value="${esc(m.opts.map(o=>o.n+':'+o.p).join(', '))}"></label><label>Photograph<select id="in7">${imgOpts(m.img)}</select></label>${chk('in8','Available',m.avail)}<div class="row"><button class="btn">Save item</button><button type="button" class="btn ghost" data-a="closeModal">Cancel</button></div></form>`)};
F.itemSave=f=>{const id=f.dataset.v;const opts=val('in6').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[n,p]=s.split(':');return{n:n.trim(),p:+p||0}});
 const d={name:val('in1'),cat:val('in2'),price:+val('in3'),offer:val('in4')?+val('in4'):null,desc:val('in5'),opts,img:val('in7'),avail:$('#in8').checked};
 if(id)Object.assign(db.menu.find(x=>x.id===id),d);else db.menu.push({...d,id:'i'+uid()});touch('Menu item saved: '+d.name);closeModal();aRefresh();toast('Menu item saved')};
A.itemAvail=(v,e)=>{const m=db.menu.find(x=>x.id===v);m.avail=e.checked;touch(m.name+(m.avail?' available':' sold out'))};
A.itemDel=v=>{const m=db.menu.find(x=>x.id===v);confirmBox('Delete "'+m.name+'" from the menu?',()=>{db.menu=db.menu.filter(x=>x.id!==v);S.cart=S.cart.filter(c=>c.id!==v);touch('Menu item deleted: '+m.name);aRefresh()},'Delete')};
A.ordSet=v=>{const[r,s]=v.split(':');const o=db.orders.find(x=>x.ref===r);o.status=s;touch('Order '+r+' '+lbl(s));aRefresh()};
A.ordStatus=(v,e)=>{const o=db.orders.find(x=>x.ref===v);o.status=e.value;touch('Order '+v+' '+lbl(o.status));aRefresh();toast('Order '+lbl(o.status))};
A.exp=v=>{if(v==='bookings')csv('Bookings',[['Reference','Guest','Phone','Room','Check-in','Check-out','Nights','Total KES','Status','Payment','Demo payment'],...db.reservations.map(r=>[r.ref,r.name,r.phone,(db.rooms.find(x=>x.id===r.roomId)||{}).name,r.in,r.out,r.nights,r.total,r.status,r.pay.status,r.pay.demo?'yes':'no'])]);
 else csv('Food orders',[['Reference','Customer','Phone','Type','Items','Subtotal','Delivery fee','Total KES','Status','Payment','Demo payment'],...db.orders.map(o=>[o.ref,o.name,o.phone,o.type,o.items.map(i=>i.qty+'x '+i.name).join('; '),o.sub,o.fee,o.total,o.status,o.pay.status,o.pay.demo?'yes':'no'])])};
A.areaOn=(v,e)=>{db.areas.find(a=>a.id===v).active=e.checked;touch('Delivery area toggled')};
A.areaForm=v=>{const a=db.areas.find(x=>x.id===v)||{name:'',fee:300,min:1000,mins:45,active:true};modal(`<h3>${v?'Edit':'Add'} delivery area</h3><form class="stack" data-form="areaSave" data-v="${v}"><label>Area name<input id="an1" required value="${esc(a.name)}"></label><div class="fgrid"><label>Fee (KES)<input id="an2" type="number" min="0" value="${a.fee}"></label><label>Minimum order (KES)<input id="an3" type="number" min="0" value="${a.min}"></label><label>Estimated minutes<input id="an4" type="number" min="5" value="${a.mins}"></label></div><button class="btn">Save area</button></form>`)};
F.areaSave=f=>{const id=f.dataset.v,d={name:val('an1'),fee:+val('an2'),min:+val('an3'),mins:+val('an4')};if(id)Object.assign(db.areas.find(a=>a.id===id),d);else db.areas.push({...d,id:'a'+uid(),active:true});touch('Delivery area saved');closeModal();aRefresh()};
F.settings=()=>{$$('[data-s]').forEach(e=>db.settings[e.dataset.s]=e.value);$$('[data-c]').forEach(e=>db.settings[e.dataset.c]=e.checked);touch('Settings saved');header();footer();toast('Settings saved')};
A.reset=()=>confirmBox('Restore the sample data? Anything you added will be removed.',()=>{db=seed();save();S.cart=[];toast('Demo data restored');render()},'Reset');
/* ===== Event wiring ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.type==='checkbox')return;if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();const f=A[t.dataset.a];f&&f(t.dataset.v,t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button][data-a]'))e.target.click();if(e.key==='Escape')closeModal()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const h=F[f.dataset.form];h&&h(f)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.a&&(t.tagName==='SELECT'||t.type==='checkbox')){A[t.dataset.a]&&A[t.dataset.a](t.dataset.v,t);return}
 if(t.id==='mup'){upload(t.files[0]);t.value='';return}
 if(['qin','qout','qad','qch'].includes(t.id)){const q=S.q;q.in=val('qin');q.out=val('qout');q.ad=Math.max(1,+val('qad')||1);q.ch=Math.max(0,+val('qch')||0);if(q.out<=q.in){q.out=addDays(q.in,1);$('#qout').value=q.out}$('#qout').min=addDays(q.in,1);$('#roomlist').innerHTML=roomsList();return}
 if(t.id==='oa'){readOrder();rerender();return}
 if(t.id==='bs'||t.id==='os'){S.af[t.id]=t.value;aRefresh()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='ms'){S.mq.s=t.value;$('#menulist').innerHTML=menuList()}
 if(t.id==='bf'||t.id==='of'){S.af[t.id==='bf'?'b':'o']=t.value;const id=t.id;aRefresh();const n=document.getElementById(id);n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
if(!location.hash)location.hash='#home';
render();
</script>

</body></html>
